apiVersion: dex.araihu.com/v1alpha1
kind: DexOAuth2Client
metadata:
  labels:
    app.kubernetes.io/name: dex-operator
    app.kubernetes.io/managed-by: kustomize
  name: dexoauth2client-sample
spec:
  id: example-client
  public: false
  name: Example Client
  redirectURIs:
  - https://app.example.invalid/callback
  postLogoutRedirectURIs:
  - https://app.example.invalid/signed-out
  secret:
    providedSecretRef:
      name: example-client-secret
      key: clientSecret
---
apiVersion: dex.araihu.com/v1alpha1
kind: DexOAuth2Client
metadata:
  labels:
    app.kubernetes.io/name: dex-operator
    app.kubernetes.io/managed-by: kustomize
  name: dexoauth2client-generated-sample
spec:
  id: generated-example-client
  public: false
  name: Generated Example Client
  redirectURIs:
  - https://generated-app.example.invalid/callback
  postLogoutRedirectURIs:
  - https://generated-app.example.invalid/signed-out
  secret:
    generated:
      secretName: generated-example-client-oidc
      clientIDKey: clientID
      clientSecretKey: clientSecret
      labels:
        app.kubernetes.io/part-of: argocd
