apiVersion: dex.araihu.com/v1alpha1
kind: DexOAuth2Client
metadata:
  labels:
    app.kubernetes.io/name: dex-operator
    app.kubernetes.io/managed-by: kustomize
  name: dexoauth2client-sample
spec:
  id: example-client
  public: false
  name: Example Client
  redirectURIs:
  - https://app.example.invalid/callback
  secret:
    providedSecretRef:
      name: example-client-secret
      key: clientSecret
